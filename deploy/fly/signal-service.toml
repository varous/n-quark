app = "nquark-signal-service"
# Fly.io — signal-service (Phase 4D private collection topology).
# PRIVATE-ONLY: <app>.flycast, no public IP. Stateless discovery/fetch/normalization for Boshow + District.
primary_region = "sin"

[build]

[env]
  NQUARK_PORT = "8003"
  NQUARK_NETWORK_MODE = "docker"
  NQUARK_SHADOW_LEDGER_ENABLED = "true"
  NQUARK_SKILLBOX_ENABLED = "false"            # Skillbox stays disabled (Phase 4C.1 decision)
  NQUARK_SKILLBOX_DISCOVERY_ENABLED = "false"
  # env-driven downstream (only used by the legacy /ingest fan-out; the collector path does not need them)
  NQUARK_GRAPH_SERVICE_URL = "http://nquark-graph-service.flycast"
  NQUARK_OBSERVATION_SERVICE_URL = "http://nquark-observation-service.flycast"
  NQUARK_ENTITY_SERVICE_URL = "http://nquark-entity-service.flycast"

[http_service]
  internal_port = 8003
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150
  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
