# Fly.io — crawl-service (Phase 4D private collection topology). THE ALWAYS-ON COLLECTOR.
# PRIVATE-ONLY: <app>.flycast, no public IP. Runs the in-process collector (discover + capture) plus
# enrichment, entity resolution and the best-effort media hook for Boshow + District. Skillbox disabled.
app = "nquark-crawl-service"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NQUARK_PORT = "8001"
  NQUARK_NETWORK_MODE = "docker"
  # --- collection sources: Boshow + District active; Skillbox NEVER enabled here ---
  NQUARK_SCHEDULED_CAPTURE_ENABLED = "true"
  NQUARK_SCHEDULED_CAPTURE_SOURCES = "boshow"
  NQUARK_SECOND_SOURCE_CAPTURE_ENABLED = "true"
  NQUARK_SECOND_SOURCE_NAME = "district"
  NQUARK_CAPTURE_ENRICHMENT_ENABLED = "true"
  NQUARK_ENTITY_RESOLUTION_ENABLED = "true"
  NQUARK_ENTITY_RESOLUTION_SOURCES = "boshow,district"
  NQUARK_RECONCILIATION_ENABLED = "true"
  NQUARK_MEDIA_OBSERVATION_ENABLED = "true"
  NQUARK_MEDIA_OBSERVATION_SOURCES = "boshow,district"
  # --- continuous in-process collector (always-on discover + capture) ---
  NQUARK_COLLECTOR_ENABLED = "true"
  NQUARK_COLLECTOR_SOURCES = "boshow,district"
  NQUARK_COLLECTOR_DISCOVERY_INTERVAL_SECONDS = "3600"
  NQUARK_COLLECTOR_CAPTURE_INTERVAL_SECONDS = "300"
  NQUARK_COLLECTOR_DISCOVERY_LIMIT = "50"
  # --- env-driven private service discovery (Flycast) ---
  NQUARK_SIGNAL_SERVICE_URL = "http://nquark-signal-service.flycast"
  NQUARK_GRAPH_SERVICE_URL = "http://nquark-graph-service.flycast"
  NQUARK_MEDIA_SERVICE_URL = "http://nquark-media-service.flycast"
  # DATABASE_URL + MIGRATION_DATABASE_URL are SECRETS. Entrypoint migrates when scheduled capture is on.

[http_service]
  internal_port = 8001
  force_https = false
  auto_stop_machines = "off"     # the scheduler/collector must stay running
  auto_start_machines = false
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 120
  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
