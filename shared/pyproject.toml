[project]
name = "nquark-common"
version = "0.1.0"
description = "Shared schemas and utilities for n-quark services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nquark_common"]
