# Fly.io — observation-service (private; append-only observation store on Postgres).
# Reachable as nquark-observation-service.flycast. Deploy:  cd services/observation-service && fly deploy
app = "nquark-observation-service"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NQUARK_PORT = "8004"
  # NQUARK_POSTGRES_URL is a secret. entrypoint runs `alembic upgrade head` before boot.

[http_service]
  internal_port = 8004
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
