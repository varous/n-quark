services:
  postgres:
    # pgvector superset of postgres:16 — same data dir, adds the `vector` extension the
    # consolidated architecture uses (graph store now, feature-service embeddings later).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nquark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nquark}
      POSTGRES_DB: ${POSTGRES_DB:-nquark}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nquark}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    # Opt-in: the graph store now defaults to Postgres. Bring Neo4j back with
    # `docker compose --profile neo4j up` (and set GRAPH_BACKEND=neo4j) if you want the
    # graph-native backend for deep-traversal work.
    profiles: ["neo4j"]
    environment:
      # Neo4j 5 requires a password of at least 8 characters.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nquarkdev}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nquark}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nquark}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  crawl-service:
    build: ./services/crawl-service
    ports:
      - "8001:8001"
    environment:
      NQUARK_NETWORK_MODE: docker
      NQUARK_POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-nquark}:${POSTGRES_PASSWORD:-nquark}@postgres:5432/${POSTGRES_DB:-nquark}
      NQUARK_SIGNAL_SERVICE_URL: http://signal-service:8003
      NQUARK_GRAPH_SERVICE_URL: http://graph-service:8006
      # Phase 2 scheduled capture — OFF by default.
      NQUARK_SCHEDULED_CAPTURE_ENABLED: ${SCHEDULED_CAPTURE_ENABLED:-false}
      NQUARK_SCHEDULED_CAPTURE_SOURCES: ${SCHEDULED_CAPTURE_SOURCES:-boshow}
      NQUARK_SCHEDULED_CAPTURE_MAX_JOBS: ${SCHEDULED_CAPTURE_MAX_JOBS:-25}
      # Phase 2.1 enrichment — OFF by default; public-page fetch separately gated.
      NQUARK_CAPTURE_ENRICHMENT_ENABLED: ${CAPTURE_ENRICHMENT_ENABLED:-false}
      NQUARK_CAPTURE_ENRICHMENT_PUBLIC_PAGE_ENABLED: ${CAPTURE_ENRICHMENT_PUBLIC_PAGE_ENABLED:-false}
      # Phase 2.2 live public-page enrichment pilot — OFF by default.
      NQUARK_CAPTURE_ENRICHMENT_PILOT_ENABLED: ${CAPTURE_ENRICHMENT_PILOT_ENABLED:-false}
      NQUARK_CAPTURE_ENRICHMENT_MIN_CONFIDENCE: ${CAPTURE_ENRICHMENT_MIN_CONFIDENCE:-0.6}
      # Phase 3 second source + reconciliation — OFF by default.
      NQUARK_SECOND_SOURCE_CAPTURE_ENABLED: ${SECOND_SOURCE_CAPTURE_ENABLED:-false}
      NQUARK_SECOND_SOURCE_NAME: ${SECOND_SOURCE_NAME:-district}
      NQUARK_RECONCILIATION_ENABLED: ${RECONCILIATION_ENABLED:-false}
      # Phase 3.1 cross-inventory entity resolution — OFF by default.
      NQUARK_ENTITY_RESOLUTION_ENABLED: ${ENTITY_RESOLUTION_ENABLED:-false}
      NQUARK_ENTITY_RESOLUTION_SOURCES: ${ENTITY_RESOLUTION_SOURCES:-boshow,district}
      # Phase 4B — best-effort creative-observation hook (OFF by default).
      NQUARK_MEDIA_OBSERVATION_ENABLED: ${CRAWL_MEDIA_OBSERVATION_ENABLED:-false}
      NQUARK_MEDIA_SERVICE_URL: http://media-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  media-service:
    build: ./services/media-service
    ports:
      - "8002:8002"
    environment:
      NQUARK_NETWORK_MODE: docker
      NQUARK_POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-nquark}:${POSTGRES_PASSWORD:-nquark}@postgres:5432/${POSTGRES_DB:-nquark}
      # Phase 4B — creative-asset observation (all OFF by default).
      NQUARK_MEDIA_OBSERVATION_ENABLED: ${MEDIA_OBSERVATION_ENABLED:-false}
      NQUARK_MEDIA_FETCH_ENABLED: ${MEDIA_FETCH_ENABLED:-false}
      NQUARK_MEDIA_STORAGE_ENABLED: ${MEDIA_STORAGE_ENABLED:-false}
      NQUARK_MEDIA_GRAPH_LINK_ENABLED: ${MEDIA_GRAPH_LINK_ENABLED:-false}
      NQUARK_MEDIA_STORAGE_DIR: /data/media
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  signal-service:
    build: ./services/signal-service
    ports:
      - "8003:8003"
    environment:
      NQUARK_NETWORK_MODE: docker
      NQUARK_OBSERVATION_SERVICE_URL: http://observation-service:8004
      NQUARK_ENTITY_SERVICE_URL: http://entity-service:8005
      NQUARK_GRAPH_SERVICE_URL: http://graph-service:8006
      NQUARK_SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      NQUARK_SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      NQUARK_SPOTIFY_MOCK_MODE: ${SPOTIFY_MOCK_MODE:-true}
      NQUARK_YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      NQUARK_YOUTUBE_REGION_CODE: ${YOUTUBE_REGION_CODE:-IN}
      NQUARK_YOUTUBE_MOCK_MODE: ${YOUTUBE_MOCK_MODE:-true}
      NQUARK_MUSICBRAINZ_MOCK_MODE: ${MUSICBRAINZ_MOCK_MODE:-true}
      NQUARK_GOOGLE_TRENDS_PROVIDER: ${GOOGLE_TRENDS_PROVIDER:-mock}
      NQUARK_GOOGLE_TRENDS_REGION: ${GOOGLE_TRENDS_REGION:-IN}
      NQUARK_DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      NQUARK_DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      NQUARK_SERPAPI_KEY: ${SERPAPI_KEY:-}
      NQUARK_TICKETING_PROVIDER: ${TICKETING_PROVIDER:-mock}
      # Shadow Ledger (Phase 1) — OFF by default; enable to record commercial-state history.
      NQUARK_SHADOW_LEDGER_ENABLED: ${SHADOW_LEDGER_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      observation-service:
        condition: service_started
      entity-service:
        condition: service_started
      graph-service:
        condition: service_started

  observation-service:
    build: ./services/observation-service
    ports:
      - "8004:8004"
    environment:
      NQUARK_POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-nquark}:${POSTGRES_PASSWORD:-nquark}@postgres:5432/${POSTGRES_DB:-nquark}
    depends_on:
      postgres:
        condition: service_healthy

  entity-service:
    build: ./services/entity-service
    ports:
      - "8005:8005"
    environment:
      NQUARK_POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-nquark}:${POSTGRES_PASSWORD:-nquark}@postgres:5432/${POSTGRES_DB:-nquark}
    depends_on:
      postgres:
        condition: service_healthy

  graph-service:
    build: ./services/graph-service
    ports:
      - "8006:8006"
    environment:
      NQUARK_GRAPH_BACKEND: ${GRAPH_BACKEND:-postgres}
      NQUARK_POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-nquark}:${POSTGRES_PASSWORD:-nquark}@postgres:5432/${POSTGRES_DB:-nquark}
      # Shadow Ledger (Phase 1) — internal write path + disappearance threshold.
      NQUARK_SHADOW_LEDGER_ENABLED: ${SHADOW_LEDGER_ENABLED:-true}
      NQUARK_SHADOW_LEDGER_DISAPPEARANCE_THRESHOLD: ${SHADOW_LEDGER_DISAPPEARANCE_THRESHOLD:-2}
      # Only used when GRAPH_BACKEND=neo4j (docker compose --profile neo4j up).
      NQUARK_NEO4J_URL: bolt://neo4j:7687
      NQUARK_NEO4J_USER: neo4j
      NQUARK_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nquarkdev}
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build: ./services/analytics-service
    ports:
      - "8007:8007"
    environment:
      NQUARK_NETWORK_MODE: docker
      NQUARK_GRAPH_SERVICE_URL: http://graph-service:8006
    depends_on:
      postgres:
        condition: service_healthy
      graph-service:
        condition: service_started

  feature-service:
    build: ./services/feature-service
    ports:
      - "8008:8008"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  intelligence-service:
    build: ./services/intelligence-service
    ports:
      - "8009:8009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      NQUARK_NETWORK_MODE: docker
      NQUARK_POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-nquark}:${POSTGRES_PASSWORD:-nquark}@postgres:5432/${POSTGRES_DB:-nquark}
      # Admin console BFF (all OFF by default). Phase C: ADMIN_LOCAL_MODE makes it a local-only,
      # unauthenticated single-INTERNAL_USER console (see docs/deployment.md) — never for cloud.
      NQUARK_ADMIN_API_ENABLED: ${ADMIN_API_ENABLED:-false}
      NQUARK_ADMIN_LOCAL_MODE: ${ADMIN_LOCAL_MODE:-false}
      NQUARK_ADMIN_DEV_AUTH_ENABLED: ${ADMIN_DEV_AUTH_ENABLED:-false}
      NQUARK_ADMIN_OPERATIONAL_ACTIONS_ENABLED: ${ADMIN_OPERATIONAL_ACTIONS_ENABLED:-false}
      NQUARK_ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-dev-insecure-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      crawl-service:
        condition: service_started
      signal-service:
        condition: service_started
      graph-service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  qdrant_data:
  minio_data:
  media_data:
